<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יפעת רון - הסיפור שלך הוא המגנט לקליניקה שלך</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        :root {
            --bg-color: #fcfaf7;          
            --primary-accent: #2C8A82;    
            --secondary-accent: #528D4D;  
            --dark-text: #2c3e35;         
            --light-bg: #ffffff;          
            --button-color: #2C8A82;      
            --button-hover: #1f635d;
        }

        body {
            font-family: 'Rubik', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-text);
            line-height: 1.65;
        }

        .top-navbar {
            background-color: #ffffff;
            border-bottom: 1px solid rgba(44, 138, 130, 0.1);
            padding: 14px 20px;
            text-align: center;
            font-size: 13pt;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--primary-accent);
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .hero {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 35px;
        }

        /* עיצוב משולב ונקי לחלוטין לשורת המידע - צבע מעודן וללא קו תחתון */
        .gift-line {
            display: inline-block;
            background-color: transparent;
            color: #4a5d53; 
            font-size: 11pt;
            font-weight: 500;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 24pt;
            color: var(--primary-accent); 
            margin-bottom: 14px;
            font-weight: 800;
            line-height: 1.35;
        }

        .subtitle {
            font-size: 12.5pt;
            color: #4a5d53;
            margin-top: 15px;
            font-weight: 400;
        }

        .image-container {
            max-width: 240px;
            margin: 30px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #ffffff;
            box-shadow: 0 8px 24px rgba(44, 138, 130, 0.08);
            position: relative;
        }
        
        .image-aspect-ratio {
            padding-top: 100%;
            position: relative;
        }

        .image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block; 
        }

        .card {
            background-color: var(--light-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(44, 138, 130, 0.03);
            margin-bottom: 30px;
            border-right: 5px solid var(--primary-accent); 
            text-align: right;
        }

        h2 {
            font-size: 15pt;
            color: var(--primary-accent);
            margin-bottom: 25px;
            font-weight: 700;
        }

        .steps-list {
            list-style-type: none;
        }

        .step-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f4f7f5;
        }

        .step-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
